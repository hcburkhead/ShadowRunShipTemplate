<script>
// ============================================================
// SHIPLINK (client-side) — Helicarrier uplink for the CASPER terminal.
//
// NO Apps Script permissions needed: this runs in the player's browser and
// talks straight to the ship's Firebase Realtime Database over fetch(),
// exactly like the ship consoles themselves do.
//
// INSTALL (Terminal.html only):
//   1. Paste this whole block into Terminal.html, anywhere in <body>.
//   2. In the term-input Enter handler, directly after the line
//           printLine("shadow@ghòstV2089:~$ " + val);
//      add this one line:
//           if (window.handleShipCommand && handleShipCommand(val)) return;
//   3. Redeploy the web app (Deploy → Manage deployments → New version).
//
// PLAYER COMMANDS:
//   ship | ship help | ship status | ship ping
//   ship timer <m:ss|secs> [NAME] | ship timer stop | ship timer reset
//   ship alt <0-100> | ship power <eng|drones|weapons|shields> <0-100>
//   SD -T <seconds>   (secret). If the GM has set a DESTRUCT CODE, the
//                     terminal then demands it — ENTER AUTHORIZATION CODE,
//                     with every keystroke masked as "." — and a wrong code
//                     burns one of the shared 3 attempts (5-minute lockout).
//   <code word>       typing the bare code word at the prompt also works:
//                     it ARMS the destruct (one shot, 10 min) so SD -T then
//                     fires without the masked prompt.
//
// GM COMMAND (not listed in help):
//   override          → HELICARRIER PASSWORD OVERRIDE: set/change the
//                     destruct code word, masked with "." while typing.
//                     Changing an existing code requires the current one.
// ============================================================
(function () {
  var SHIP_DB = 'https://shadowrun-ship-db-default-rtdb.firebaseio.com';
  var TRIES = 3, LOCK_MS = 5 * 60 * 1000;

  function dbGet(key) {
    return fetch(SHIP_DB + '/' + key + '.json').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function dbPut(key, value) {
    return fetch(SHIP_DB + '/' + key + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value),
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); });
  }
  function sendCmd(cmd) {
    return dbPut('shipCommand', {
      id: 'casper-' + Date.now() + '-' + Math.random().toString(36).slice(2),
      at: Date.now(), cmd: String(cmd),
    });
  }

  function out(lines, red) {
    (Array.isArray(lines) ? lines : [lines]).forEach(function (l) { printLine(l, !!red); });
  }
  function clock(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2);
  }
  function fail(e) {
    out(['> ERR: UPLINK FAILED — ' + ((e && e.message) || e),
         '> (check the network, or Firebase rules for shipCommand + shipTerminal + shipDestruct)'], true);
  }

  // shared ship-terminal lockout state (same shape every console uses)
  function normTerm(t) {
    t = t && typeof t === 'object' ? t : {};
    return {
      attempts: Math.max(0, Math.min(TRIES, parseInt(t.attempts, 10) || 0)),
      lockUntil: Math.max(0, Number(t.lockUntil) || 0),
      hist: Array.isArray(t.hist) ? t.hist : [],
    };
  }
  function saveTerm(t, lines) {
    (lines || []).forEach(function (l) { t.hist.push(l); });
    t.hist = t.hist.slice(-6);
    return dbPut('shipTerminal', t);
  }
  function destructCode(d) {
    return String((d && d.code) || '').toUpperCase().trim().slice(0, 24);
  }
  function codeHash(s) {   // short fingerprint (never the code) for DM verification
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
    return '#' + ('0' + (h % 256).toString(16).toUpperCase()).slice(-2);
  }

  // cached copy of the code so the bare word can be recognized at the prompt
  // (refreshed at load, every 60s, and after every SD/override interaction)
  var cachedCode = '';
  var SD_ARM_MS = 10 * 60 * 1000, armedUntil = 0;   // bare code word arms SD (one shot)
  function refreshCode() {
    return dbGet('shipDestruct').then(function (d) { cachedCode = destructCode(d); return cachedCode; })
      .catch(function () { return cachedCode; });
  }
  refreshCode();
  setInterval(refreshCode, 60000);

  // ── masked input mode ("." per keystroke, capture-phase so the terminal
  //    never sees the keys). onEnter(buffer) → truthy keeps the mode open. ──
  var mask = null;   // { buf, onEnter }
  function input() { return document.getElementById('term-input'); }
  function maskStart(onEnter) { mask = { buf: '', onEnter: onEnter }; input().value = ''; }
  function maskStop() { mask = null; input().value = ''; }
  document.addEventListener('keydown', function (e) {
    var el = input();
    if (!mask || !el || e.target !== el) return;
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { maskStop(); out('> CANCELLED.', true); return; }
    if (e.key === 'Enter') {
      var buf = mask.buf, cont = mask.onEnter;
      out('> ' + new Array(Math.max(1, buf.length) + 1).join('.'));   // obfuscated echo
      maskStop();
      cont(buf);
      return;
    }
    if (e.key === 'Backspace') mask.buf = mask.buf.slice(0, -1);
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) mask.buf += e.key;
    el.value = new Array(mask.buf.length + 1).join('.');
  }, true);
  document.addEventListener('paste', function (e) {
    if (mask && e.target === input()) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  // fire the destruct once authorized (or when no code is required)
  function launchSD(t, up, secs) {
    return sendCmd(up).then(function () {
      t.attempts = 0;
      saveTerm(t, [{ m: '▮ CASPER > ' + up, c: 'tl-in' },
                   { m: '⚠ COMMAND ACCEPTED — SELF-DESTRUCT SEQUENCE INITIATED · T-' + clock(secs), c: 'tl-ok' }]);
      out(['> UPLINK ACCEPTED.',
           '> SELF-DESTRUCT SEQUENCE INITIATED — T-' + clock(secs),
           '> THIS TERMINAL IS NOT RESPONSIBLE FOR WHAT HAPPENS NEXT.'], true);
    });
  }
  function burn(t, echo, what) {   // one failed attempt; the 3rd locks
    t.attempts++;
    if (t.attempts >= TRIES) {
      t.attempts = 0;
      t.lockUntil = Date.now() + LOCK_MS;
      saveTerm(t, [{ m: echo, c: 'tl-in' }, { m: '✖ ' + what + ' — TERMINAL LOCKED (5:00)', c: 'tl-lock' }]);
      out('> ' + what + ' — SHIP UPLINK LOCKED (5:00)', true);
    } else {
      var left = TRIES - t.attempts;
      saveTerm(t, [{ m: echo, c: 'tl-in' }, { m: '✖ ' + what + ' — ' + left + ' ATTEMPT(S) REMAINING', c: 'tl-err' }]);
      out('> ' + what + ' — ' + left + ' ATTEMPT(S) REMAINING', true);
    }
  }

  // returns TRUE when the input was a ship command (response prints async)
  window.handleShipCommand = function (raw) {
    var s = String(raw || '').trim().replace(/\s+/g, ' ');
    var up = s.toUpperCase();

    // ── typing the bare code word authorizes: ARMS the destruct (one shot)
    //    so SD -T fires without the masked prompt ──
    if (cachedCode && up === cachedCode) {
      armedUntil = Date.now() + SD_ARM_MS;
      out(['⚿ AUTHORIZATION CODE ACCEPTED — DESTRUCT ARMED.',
           '> enter SD -T <seconds> to initiate.'], true);
      refreshCode();
      return true;
    }

    // ── HELICARRIER PASSWORD OVERRIDE (GM): set the destruct code word ──
    if (/^(OVERRIDE|HELICARRIER PASSWORD OVERRIDE)$/.test(up)) {
      dbGet('shipDestruct').then(function (d) {
        var current = destructCode(d);
        out(['╔══════════════════════════════════════╗',
             '║   HELICARRIER PASSWORD OVERRIDE      ║',
             '╚══════════════════════════════════════╝']);
        function setNew() {
          out('ENTER NEW DESTRUCT CODE: (ESC to cancel, empty = clear)');
          maskStart(function (buf) {
            var code = buf.toUpperCase().trim().slice(0, 24);
            if (code && code.length < 3) { out('✖ CODE TOO SHORT (MIN 3 CHARS) — override aborted.', true); return; }
            dbPut('shipDestruct', { code: code, at: Date.now() }).then(function () {
              cachedCode = code;
              out(code ? ['▸ DESTRUCT CODE SET (KEY ' + codeHash(code) + ').',
                          '▸ SD -T now demands the code word.',
                          '▸ verify: the DM console shows the same KEY fingerprint.']
                       : ['▸ DESTRUCT CODE CLEARED.', '▸ SD -T works on syntax alone.']);
            }).catch(fail);
          });
        }
        if (current) {
          out('ENTER CURRENT CODE: (ESC to cancel)');
          maskStart(function (buf) {
            if (buf.toUpperCase().trim() !== current) { out('✖ CURRENT CODE INCORRECT — override aborted.', true); return; }
            setNew();
          });
        } else {
          setNew();
        }
      }).catch(fail);
      return true;
    }

    // ── the self-destruct command (shares the ship terminal lockout) ──
    if (/^SD( |$)/.test(up)) {
      Promise.all([dbGet('shipTerminal'), dbGet('shipDestruct')]).then(function (res) {
        var t = normTerm(res[0]), code = destructCode(res[1]), now = Date.now();
        if (t.lockUntil > now) {
          out('> SHIP UPLINK LOCKED — RETRY IN ' + clock((t.lockUntil - now) / 1000), true);
          return;
        }
        cachedCode = code;                               // keep the arm check fresh
        var m = up.match(/^SD -T (\d{1,4})$/);
        if (!m) { burn(t, '▮ CASPER > ' + up, 'COMMAND NOT RECOGNIZED'); return; }
        var secs = Math.max(1, Math.min(5999, parseInt(m[1], 10)));
        if (!code || Date.now() <= armedUntil) {         // no code, or already authorized
          armedUntil = 0;                                // an arm is one-shot
          launchSD(t, up, secs).catch(fail);
          return;
        }
        // GM set a code word: demand it, masked with "."
        out('⚿ AUTHORIZATION CODE REQUIRED — ENTER CODE: (ESC to cancel)', true);
        maskStart(function (buf) {
          var guess = buf.toUpperCase().trim();
          if (guess && guess === code) { launchSD(t, up, secs).catch(fail); return; }
          burn(t, '▮ CASPER > ' + up + ' [BAD AUTH CODE]', 'AUTHORIZATION CODE INVALID');
        });
      }).catch(fail);
      return true;
    }

    // ── everything else lives under "ship ..." ──
    if (!/^SHIP( |$)/.test(up)) return false;   // not ours — CASPER handles it
    var arg = up.slice(4).trim();

    if (!arg || arg === 'HELP' || arg === '-H') {
      out([
        '═══════════════════════════════════════',
        '   - HELICARRIER UPLINK -',
        '═══════════════════════════════════════',
        '',
        '  ship status              → live ship readout',
        '  ship timer <m:ss> [NAME] → start a countdown',
        '  ship timer stop          → pause the countdown',
        '  ship timer reset         → clear the countdown',
        '  ship alt <0-100>         → set altitude',
        '  ship power <sys> <0-100> → throttle a system',
        '       sys: eng | drones | weapons | shields',
        '  ship ping                → uplink diagnostic',
        '',
        'EXAMPLES:',
        '  ship timer 5:00 CORE MELTDOWN',
        '  ship power weapons 0',
        '  ship alt 25',
        '',
        '═══════════════════════════════════════',
      ]);
      return true;
    }

    if (arg === 'PING') {
      dbGet('shipTimer').then(function () {
        return dbPut('shipPing', { at: Date.now() });
      }).then(function () {
        out(['--- UPLINK DIAGNOSTIC ---', 'TARGET: ' + SHIP_DB,
             'READ  : OK', 'WRITE : OK',
             '> uplink healthy — commands will reach the ship.']);
      }).catch(fail);
      return true;
    }

    if (arg === 'STATUS') {
      Promise.all([dbGet('shipDamageState'), dbGet('shipAux'), dbGet('shipTimer')])
        .then(function (res) {
          var dmg = res[0] || {}, aux = res[1] || {}, tm = res[2] || {};
          var r = parseInt((dmg.areas || {}).reactor, 10) || 0;
          var core = r >= 2 ? 0 : r >= 1 ? 50 : 100;
          var auxDmg = Math.max(0, Math.min(50, Number(aux.auxDmg) || 0));
          var left = tm.running && tm.endsAt ? Math.max(0, (tm.endsAt - Date.now()) / 1000) : (Number(tm.remaining) || 0);
          out([
            '--- HELICARRIER UPLINK STATUS ---',
            'CORE POWER : ' + core + '%' + (core === 0 ? '  [REACTOR OFFLINE]' : core === 50 ? '  [REACTOR DAMAGED]' : ''),
            'AUX BANK   : ' + (50 - auxDmg) + '% CAP' + (auxDmg >= 50 ? '  [OFFLINE]' : ''),
            'OVERDRIVE  : ' + (aux.overdrive ? 'ENGAGED' : 'off'),
            'COUNTDOWN  : ' + (tm.running ? (tm.label || 'IMPACT') + ' — ' + clock(left) : 'inactive'),
          ]);
        }).catch(fail);
      return true;
    }

    // whitelisted pass-through — the few specific commands players may send
    var ALLOWED = [
      /^TIMER (STOP|RESET)$/,
      /^TIMER \d{1,4}( .+)?$/, /^TIMER \d{1,3}:[0-5]\d( .+)?$/,
      /^ALT \d{1,3}$/,
      /^POWER (ENG|ENGINES|DRONES|DRN|WEAPONS|WPN|SHIELDS|SHD) \d{1,3}$/,
    ];
    for (var i = 0; i < ALLOWED.length; i++) {
      if (ALLOWED[i].test(arg)) {
        sendCmd(arg).then(function () { out('> UPLINK SENT: ' + arg); }).catch(fail);
        return true;
      }
    }
    out(['> ERR: unknown ship command.', '> Type "ship help" for the uplink index.'], true);
    return true;
  };
})();
</script>
