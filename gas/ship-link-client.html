<script>
// ============================================================
// SHIPLINK (client-side) — Helicarrier uplink for the CASPER terminal.
//
// NO Apps Script permissions needed: this runs in the player's browser and
// talks straight to the ship's Firebase Realtime Database over fetch(),
// exactly like the ship consoles themselves do.
//
// INSTALL (Terminal.html only):
//   1. Paste this whole block into Terminal.html, anywhere in <body>.
//   2. In the term-input Enter handler, directly after the line
//           printLine("shadow@ghòstV2089:~$ " + val);
//      add this one line:
//           if (window.handleShipCommand && handleShipCommand(val)) return;
//   3. Redeploy the web app (Deploy → Manage deployments → New version).
//
// HOW IT PLAYS:
//   hack establish uplink
//       → hack check: d20 (red canvas roll, like the hacking tools), DC 10.
//         On 10+ an SSH-style remote session opens — the prompt becomes
//         root@helicarrier:~# and the terminal mimics the SHIP TERMINAL
//         console: same shared log, same 3-attempt / 5-minute lockout, and
//         the GM's secret DESTRUCT CODE word. Typing the accepted code word
//         initiates the SELF-DESTRUCT (it starts the ship's OH SH*T! timer
//         with whatever duration the DM configured). Below 10: connection
//         refused — retry. EXIT / LOGOUT / DISCONNECT closes the session.
//         ("establish helicarrier uplink" is accepted too.)
//
//   inside the session, the hacker's restricted STS command set:
//     sts | sts help              → command index
//     sts status                  → live ship readout (read-only)
//     sts aux <sys> <0-50>        → route the AUX reserve to a system
//     sts batt <sys> <0-25>       → route the BACKUP BATTERY to a system
//          sys: eng | drones | weapons | shields
//     sts ping                    → uplink diagnostic (read-only)
//   nothing else — no core throttle, no timers, no altitude. Unknown STS
//   subcommands do NOT burn attempts; anything typed outside the STS
//   namespace is treated as a code attempt, exactly like the ship terminal.
//
//   sts reveal → a SEPARATE hack: interrogate the ship's sarcastic AI
//   for the destruct code word. Rolls d20 + the character's LOGIC
//   modifier (resolved from the sheet via resolveRollModifier):
//     · NATURAL 20        → the ship AI reveals the code itself
//     · total ≥ 20        → the ship AI concedes a HINT — the DM (voicing it)
//                           delivers it at the table; the DM console log
//                           is pinged so they know a hint is owed
//     · below 20          → snark, nothing, no attempts burned
//     · NATURAL 1         → counter-intrusion: burns an attempt and locks
//                           the terminal for 10 MINUTES (fires even if the
//                           AI core is down — the ship's ICE never sleeps)
//   Only while the AI CORE is ONLINE — damaged/offline AI gives static
//   even on a crit. The gamble alternative to hunting the code through
//   DM challenges.
//
// GM COMMAND (not listed anywhere):
//   override → HELICARRIER PASSWORD OVERRIDE: set/change the destruct code
//              word, masked with "." while typing. Changing an existing code
//              requires the current one. Reports a KEY fingerprint that must
//              match the DM console's DESTRUCT CODE status.
// ============================================================
(function () {
  var SHIP_DB = 'https://shadowrun-ship-db-default-rtdb.firebaseio.com';
  var TRIES = 3, LOCK_MS = 5 * 60 * 1000;
  var PROMPT = 'root@helicarrier:~#';

  function dbGet(key) {
    return fetch(SHIP_DB + '/' + key + '.json').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function dbPut(key, value) {
    return fetch(SHIP_DB + '/' + key + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value),
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); });
  }
  function sendCmd(cmd) {   // GM/console command channel (executed by the operator pages)
    return dbPut('shipCommand', {
      id: 'casper-' + Date.now() + '-' + Math.random().toString(36).slice(2),
      at: Date.now(), cmd: String(cmd),
    });
  }

  function out(lines, red) {
    (Array.isArray(lines) ? lines : [lines]).forEach(function (l) { printLine(l, !!red); });
  }
  function clock(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2);
  }
  function fail(e) {
    out(['> ERR: UPLINK FAILED — ' + ((e && e.message) || e),
         '> (check the network, or Firebase rules for shipTerminal + shipDestruct + shipTimer)'], true);
  }
  function dots(n) { return new Array(Math.max(1, n) + 1).join('.'); }

  // shared ship-terminal state (same shape every console uses)
  function normTerm(t) {
    t = t && typeof t === 'object' ? t : {};
    return {
      attempts: Math.max(0, Math.min(TRIES, parseInt(t.attempts, 10) || 0)),
      lockUntil: Math.max(0, Number(t.lockUntil) || 0),
      hist: Array.isArray(t.hist) ? t.hist : [],
    };
  }
  function saveTerm(t, lines) {
    (lines || []).forEach(function (l) { t.hist.push(l); });
    t.hist = t.hist.slice(-6);
    return dbPut('shipTerminal', t);
  }
  function destructCode(d) {
    return String((d && d.code) || '').toUpperCase().trim().slice(0, 24);
  }
  function codeHash(s) {   // short fingerprint (never the code) for DM verification
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
    return '#' + ('0' + (h % 256).toString(16).toUpperCase()).slice(-2);
  }
  function burn(t, echo, what) {   // one failed attempt; the 3rd locks
    t.attempts++;
    if (t.attempts >= TRIES) {
      t.attempts = 0;
      t.lockUntil = Date.now() + LOCK_MS;
      saveTerm(t, [{ m: echo, c: 'tl-in' }, { m: '✖ ' + what + ' — TERMINAL LOCKED (5:00)', c: 'tl-lock' }]);
      out('✖ ' + what + ' — TERMINAL LOCKED (5:00)', true);
    } else {
      var left = TRIES - t.attempts;
      saveTerm(t, [{ m: echo, c: 'tl-in' }, { m: '✖ ' + what + ' — ' + left + ' ATTEMPT(S) REMAINING', c: 'tl-err' }]);
      out('✖ ' + what + ' — ' + left + ' ATTEMPT(S) REMAINING', true);
    }
  }

  function input() { return document.getElementById('term-input'); }

  // ── SSH-style remote session: prompt swap + we own the Enter key so the
  //    accepted code word can be echoed obfuscated ──
  var session = false;
  var promptSpan = null, promptOld = '';
  function setPrompt(txt) {
    if (!promptSpan) promptSpan = document.querySelector('.term-input-line span');
    if (!promptSpan) return;
    if (!promptOld) promptOld = promptSpan.textContent;
    promptSpan.textContent = txt;
  }
  function openSession() {
    session = true;
    setPrompt(PROMPT);
    out(['───────────────────────────────────────────',
         ' SECURE UPLINK ESTABLISHED · SHIPNET/2089',
         ' HELICARRIER SHIP TERMINAL — remote session',
         ' type STS HELP for shipnet commands',
         ' type EXIT to disconnect',
         '───────────────────────────────────────────']);
  }
  function closeSession(msg) {
    session = false;
    if (promptSpan && promptOld) promptSpan.textContent = promptOld;
    out(msg || '> uplink closed.');
  }
  window.shipUplinkActive = function () { return session; };

  document.addEventListener('keydown', function (e) {
    var el = input();
    if (!session || !el || e.target !== el || e.key !== 'Enter') return;
    e.preventDefault(); e.stopPropagation();
    var raw = String(el.value || '').trim().replace(/\s+/g, ' ');
    el.value = '';
    if (!raw) return;
    var up = raw.toUpperCase();
    if (/^(EXIT|LOGOUT|QUIT|DISCONNECT)$/.test(up)) {
      out(PROMPT + ' ' + up);
      closeSession('> CONNECTION CLOSED BY REMOTE HOST.');
      return;
    }
    Promise.all([dbGet('shipTerminal'), dbGet('shipDestruct'), dbGet('shipTimer')]).then(function (res) {
      var t = normTerm(res[0]), code = destructCode(res[1]), tm = res[2] || {};
      var now = Date.now();
      if (t.lockUntil > now) {
        out(PROMPT + ' ' + up);
        out('✖ TERMINAL LOCKED — RETRY IN ' + clock((t.lockUntil - now) / 1000), true);
        return;
      }
      // STS shipnet namespace — utility commands, never code attempts
      if (/^STS( |$)/.test(up)) {
        out(PROMPT + ' ' + up);
        return handleSts(up.slice(3).trim());
      }
      if (code && up === code) {
        out(PROMPT + ' ' + dots(up.length));           // never echo the code
        // the code word IS the trigger — the countdown runs for whatever
        // duration the DM configured on the ship's OH SH*T! timer
        var dur = Math.max(1, parseInt(tm.duration, 10) || 600);
        t.attempts = 0;
        return dbPut('shipTimer', { duration: dur, remaining: dur, running: true, endsAt: Date.now() + dur * 1000, label: 'SELF-DESTRUCT' })
          .then(function () {
            return saveTerm(t, [{ m: '> ' + dots(up.length), c: 'tl-in' },
                                { m: '⚠ CODE ACCEPTED — SELF-DESTRUCT SEQUENCE INITIATED · T-' + clock(dur), c: 'tl-ok' }]);
          })
          .then(function () {
            out(['⚠ CODE ACCEPTED.',
                 '⚠ SELF-DESTRUCT SEQUENCE INITIATED — T-' + clock(dur),
                 '> GET TO THE ESCAPE PODS.'], true);
          });
      }
      out(PROMPT + ' ' + up);
      burn(t, '> ' + up, 'COMMAND NOT RECOGNIZED');
    }).catch(fail);
  }, true);

  // ── STS shipnet commands (in-session only; hacker-restricted set) ──
  function handleSts(arg) {
    if (!arg || arg === 'HELP' || arg === '-H') {
      out([
        '═══════════════════════════════════════',
        '   - STS SHIPNET COMMAND INDEX -',
        '   access level: REMOTE // RESTRICTED',
        '═══════════════════════════════════════',
        '',
        '  sts status            → live ship readout',
        '  sts aux <sys> <0-50>  → route AUX reserve',
        '  sts batt <sys> <0-25> → route BACKUP BATTERY',
        '       sys: eng | drones | weapons | shields',
        '  sts reveal            → interrogate the ship AI',
        '       (d20 + LOGIC · nat 20 = code · 20+ = hint',
        '        · nat 1 = counter-intrusion lockout)',
        '  sts ping              → uplink diagnostic',
        '  exit                  → disconnect',
        '',
        'EXAMPLES:',
        '  sts aux shields 50',
        '  sts batt eng 25',
        '',
        '═══════════════════════════════════════',
      ]);
      return;
    }
    if (/^REVEAL( PASSCODE| CODE)?$/.test(arg)) return doReveal();
    if (arg === 'PING') {
      return dbGet('shipTimer').then(function () {
        return dbPut('shipPing', { at: Date.now() });
      }).then(function () {
        out(['--- UPLINK DIAGNOSTIC ---', 'TARGET: ' + SHIP_DB,
             'READ  : OK', 'WRITE : OK',
             '> uplink healthy — commands will reach the ship.']);
      }).catch(fail);
    }
    if (arg === 'STATUS') {
      return Promise.all([dbGet('shipDamageState'), dbGet('shipAux'), dbGet('shipTimer')])
        .then(function (res) {
          var dmg = res[0] || {}, aux = res[1] || {}, tm = res[2] || {};
          var r = parseInt((dmg.areas || {}).reactor, 10) || 0;
          var core = r >= 2 ? 0 : r >= 1 ? 50 : 100;
          var auxDmg = Math.max(0, Math.min(50, Number(aux.auxDmg) || 0));
          var left = tm.running && tm.endsAt ? Math.max(0, (tm.endsAt - Date.now()) / 1000) : (Number(tm.remaining) || 0);
          out([
            '--- HELICARRIER SHIPNET STATUS ---',
            'CORE POWER : ' + core + '%' + (core === 0 ? '  [REACTOR OFFLINE]' : core === 50 ? '  [REACTOR DAMAGED]' : ''),
            'AUX BANK   : ' + (50 - auxDmg) + '% CAP' + (auxDmg >= 50 ? '  [OFFLINE]' : ''),
            'OVERDRIVE  : ' + (aux.overdrive ? 'ENGAGED' : 'off'),
            'COUNTDOWN  : ' + (tm.running ? (tm.label || 'IMPACT') + ' — ' + clock(left) : 'inactive'),
          ]);
        }).catch(fail);
    }
    // the hacker may only touch the reserve banks: AUX and BACKUP BATTERY
    var ALLOWED = [
      /^AUX (ENG|ENGINES|DRONES|DRN|WEAPONS|WPN|SHIELDS|SHD) \d{1,3}$/,
      /^BATT (ENG|ENGINES|DRONES|DRN|WEAPONS|WPN|SHIELDS|SHD) \d{1,3}$/,
    ];
    for (var i = 0; i < ALLOWED.length; i++) {
      if (ALLOWED[i].test(arg)) {
        return sendCmd(arg).then(function () { out('> COMMAND RELAYED: ' + arg); }).catch(fail);
      }
    }
    if (/^(TIMER|ALT|POWER)( |$)/.test(arg)) {   // known shipnet systems, above this clearance
      out(['✖ ACCESS DENIED — insufficient clearance for that subsystem.',
           '> remote sessions may only route AUX / BATT reserves.'], true);   // no attempt burned
      return;
    }
    out(['✖ unknown sts command.', '> type STS HELP for the shipnet index.'], true);   // no attempt burned
  }

  // ── red hack d20 (same colour as CASPER's hacking tools) ──
  function rollHackDie(done) {
    var die = 1 + Math.floor(Math.random() * 20);
    if (typeof makeD20Roller === 'function') {
      try {
        var outEl = document.getElementById('term-output');
        var wrap = document.createElement('div'); wrap.className = 'd20-roll-inline';
        var canvas = document.createElement('canvas');
        canvas.width = 520; canvas.height = 360; canvas.className = 'd20-canvas';
        wrap.appendChild(canvas); outEl.appendChild(wrap); outEl.scrollTop = outEl.scrollHeight;
        makeD20Roller(canvas, '#ff4444').roll(die);
        setTimeout(function () { done(die); }, 1300);
        return;
      } catch (err) { /* fall through to text-only */ }
    }
    done(die);
  }

  // ── hack check: d20, DC 10 ──
  function establishUplink() {
    if (session) { out('> uplink already active.'); return; }
    out('> PROBING SHIPNET ICE — HACK CHECK (DC 10)...');
    rollHackDie(function (die) {
      out('> ROLL: d20(' + die + ')' + (die >= 10 ? ' — ACCESS GRANTED' : ' — ACCESS DENIED'), die < 10);
      if (die >= 10) openSession();
      else out(['✖ CONNECTION REFUSED — ICE DEFLECTED THE PROBE.', '> re-run the command to try again.'], true);
    });
  }

  // ── sts reveal: interrogate the ship AI for the destruct code word.
  //    d20 + LOGIC modifier (from the character sheet). Natural 20 → the
  //    code; total ≥ 20 → a HINT the DM delivers in the ship AI's voice;
  //    below → snark; natural 1 → counter-intrusion. Roll numbers are never
  //    shown — results read as SKILL EFFORT (beginner … masterwork). ──
  var REVEAL_ATTR = 'logic';   // sheet attribute used for the interrogation check
  var AI_SNARK = [
    'Nice try, hotshot. My lips — metaphorical — are sealed.',
    'You call THAT an intrusion vector? Adorable.',
    'I have seen toasters with better technique. Denied.',
    'Almost. In the way that missing the ship entirely is "almost".',
    'The code is— no. No, I am not doing this. Ask the DM like everyone else.',
  ];
  // roll → skill-effort wording (no numbers leave the dice canvas)
  function effortLabel(die, total) {
    if (die === 20) return 'MASTERWORK — FLAWLESS EXECUTION';
    if (die === 1) return 'SCRIPT-KIDDIE — FLAILING AT THE KEYS';
    if (total >= 20) return 'EXPERT — SURGICAL INTRUSION WORK';
    if (total >= 15) return 'PROFESSIONAL — CLEAN, PRACTICED WORK';
    if (total >= 11) return 'COMPETENT — JOURNEYMAN TECHNIQUE';
    if (total >= 6) return 'AMATEUR — ENTHUSIASTIC BUT MESSY';
    return 'BEGINNER — TUTORIAL-LEVEL KEYSTROKES';
  }
  function getRevealMod(cb) {   // resolve the LOGIC modifier from the sheet
    try {
      google.script.run
        .withSuccessHandler(function (r) { cb((r && r.mod) | 0, (r && r.name) || REVEAL_ATTR.toUpperCase()); })
        .withFailureHandler(function () { cb(0, REVEAL_ATTR.toUpperCase()); })
        .resolveRollModifier(REVEAL_ATTR);
    } catch (e) { cb(0, REVEAL_ATTR.toUpperCase()); }
  }
  function doReveal() {
    out('> INTERROGATING SHIP AI — DEEP ACCESS CHECK...');
    getRevealMod(function (mod) {
      rollHackDie(function (die) {
        var total = die + mod;
        var effort = effortLabel(die, total);
        var effortShort = effort.split(' — ')[0].toLowerCase();   // e.g. "professional"
        out('> INTRUSION ANALYSIS: ' + effort, die !== 20 && total < 20);
        Promise.all([dbGet('shipDamageState'), dbGet('shipDestruct'), dbGet('shipTerminal')]).then(function (res) {
          var ai = parseInt((((res[0] || {}).areas) || {}).aiCore, 10) || 0;
          var code = destructCode(res[1]);
          var t = normTerm(res[2]);
          if (die === 1) {   // CRITICAL FAILURE — counter-intrusion: burn + 10-minute lockout
            t.attempts++;
            if (t.attempts >= TRIES) t.attempts = 0;
            t.lockUntil = Date.now() + 10 * 60 * 1000;
            saveTerm(t, [{ m: '☠ AI counter-intrusion — remote operator locked out (10:00) — ' + effortShort + ' effort', c: 'tl-lock' }]);
            out(ai >= 1
              ? ['[SHIP AI] ▒▒—bzzt—▒ …even d-damaged, I f-felt that one… ▒▒',
                 '☠ COUNTER-INTRUSION TRIGGERED.',
                 '✖ ATTEMPT BURNED — TERMINAL LOCKED (10:00)']
              : ['[SHIP AI] "That was... genuinely embarrassing to watch. Beginner hour is over."',
                 '[SHIP AI] "Counter-intrusion deployed. Enjoy the timeout, hotshot."',
                 '✖ ATTEMPT BURNED — TERMINAL LOCKED (10:00)'], true);
            return;
          }
          if (ai >= 1) {   // damaged or offline — no banter, no code, no hint
            saveTerm(t, [{ m: '▮ REMOTE > AI interrogation — core unresponsive', c: 'tl-sys' }]);
            out(['[SHIP AI] ▒▒—bzzt—▒ …c-core integrity c-comp-promised… ▒▒',
                 '✖ AI CORE UNRESPONSIVE — NOTHING RECOVERED.'], true);
            return;
          }
          if (die === 20) {                 // natural 20 — the code itself
            if (!code) {
              out('[SHIP AI] "A flawless crack, and the vault is empty — no destruct code is even configured. Anticlimactic."');
              return;
            }
            saveTerm(t, [{ m: '⚿ ship AI disclosed the destruct code to a remote operator', c: 'tl-lock' }]);
            out(['[SHIP AI] "Oh, FINE. Masterwork intrusion. You beautiful nuisance."',
                 '[SHIP AI] "The destruct code is «' + code + '». Do give me a head start."']);
            return;
          }
          if (total >= 20) {                // expert effort — a hint, voiced by the DM
            if (!code) {
              out('[SHIP AI] "Impressive-ish. But there is no destruct code configured to hint at. Awkward."');
              return;
            }
            saveTerm(t, [{ m: '⚿ ship AI concedes a destruct-code HINT — ' + effortShort + ' effort — DM delivers it', c: 'tl-ok' }]);
            out(['[SHIP AI] "Expert work. Not flawless — I checked — but a deal is a deal."',
                 '[SHIP AI] "One hint. Lean in — your operator will do the voice."',
                 '> HINT AUTHORIZED — the DM delivers the ship AI\'s hint at the table.']);
            return;
          }
          saveTerm(t, [{ m: '▮ REMOTE > AI interrogation shrugged off — ' + effortShort + ' effort', c: 'tl-err' }]);
          out('[SHIP AI] "' + AI_SNARK[die % AI_SNARK.length] + '"', true);
        }).catch(fail);
      });
    });
  }

  // ── masked input for the GM override ("." per keystroke) ──
  var mask = null;
  function maskStart(onEnter) { mask = { buf: '', onEnter: onEnter }; input().value = ''; }
  function maskStop() { mask = null; input().value = ''; }
  document.addEventListener('keydown', function (e) {
    var el = input();
    if (!mask || !el || e.target !== el) return;
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { maskStop(); out('> CANCELLED.', true); return; }
    if (e.key === 'Enter') {
      var buf = mask.buf, cont = mask.onEnter;
      out('> ' + dots(buf.length));
      maskStop();
      cont(buf);
      return;
    }
    if (e.key === 'Backspace') mask.buf = mask.buf.slice(0, -1);
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) mask.buf += e.key;
    el.value = mask.buf.length ? dots(mask.buf.length) : '';
  }, true);
  document.addEventListener('paste', function (e) {
    if (mask && e.target === input()) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  // returns TRUE when the input was handled here (response prints async)
  window.handleShipCommand = function (raw) {
    var s = String(raw || '').trim().replace(/\s+/g, ' ');
    var up = s.toUpperCase();

    // the hack command that opens the remote ship-terminal session
    // ("hack establish uplink" — longer/older phrasings accepted too)
    if (/^(HACK )?ESTABLISH (HELICARRIER )?UPLINK$/.test(up)) { establishUplink(); return true; }

    // ── HELICARRIER PASSWORD OVERRIDE (GM): set the destruct code word ──
    if (/^(OVERRIDE|HELICARRIER PASSWORD OVERRIDE)$/.test(up)) {
      dbGet('shipDestruct').then(function (d) {
        var current = destructCode(d);
        out(['╔══════════════════════════════════════╗',
             '║   HELICARRIER PASSWORD OVERRIDE      ║',
             '╚══════════════════════════════════════╝']);
        function setNew() {
          out('ENTER NEW DESTRUCT CODE: (ESC to cancel, empty = clear)');
          maskStart(function (buf) {
            var code = buf.toUpperCase().trim().slice(0, 24);
            if (code && code.length < 3) { out('✖ CODE TOO SHORT (MIN 3 CHARS) — override aborted.', true); return; }
            dbPut('shipDestruct', { code: code, at: Date.now() }).then(function () {
              out(code ? ['▸ DESTRUCT CODE SET (KEY ' + codeHash(code) + ').',
                          '▸ typing the code word at the ship terminal (or an uplink session) initiates self-destruct.',
                          '▸ verify: the DM console shows the same KEY fingerprint.']
                       : ['▸ DESTRUCT CODE CLEARED.']);
            }).catch(fail);
          });
        }
        if (current) {
          out('ENTER CURRENT CODE: (ESC to cancel)');
          maskStart(function (buf) {
            if (buf.toUpperCase().trim() !== current) { out('✖ CURRENT CODE INCORRECT — override aborted.', true); return; }
            setNew();
          });
        } else {
          setNew();
        }
      }).catch(fail);
      return true;
    }

    return false;   // not ours — CASPER handles it
  };
})();
</script>
